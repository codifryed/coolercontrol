####################################### debian Docker Images

# dockerhub cloud builder job (limited build minutes)
push_dh-debian:
  image: docker:dind
  <<: [*main_image_template]
  stage: build
  services:
    - docker:dind
  needs:
    - compile_artifacts
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
