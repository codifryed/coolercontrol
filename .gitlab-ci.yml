variables:
  IMAGE_VERSION: v4
  # apt-publish keeps its own tag. The sibling package repositories pull it too, and every
  # publish rewrites Release, so all publishers have to run the same script.
  APT_PUBLISH_IMAGE_VERSION: v3
  CARGO_HOME: '${CI_PROJECT_DIR}/.cargo'
  PIP_CACHE_DIR: '${CI_PROJECT_DIR}/.pip'
  NPM_CONFIG_CACHE: '${CI_PROJECT_DIR}/.npm'
  XDG_CACHE_HOME: '${CI_PROJECT_DIR}/.cache'
  # Zstandard in parallel: 12% smaller than zip for the Rust build caches, and as fast to restore.
  # A cache saved in either format restores in the other. The level makes no difference with it.
  CACHE_COMPRESSION_FORMAT: zipzstd
  # error on any rustc or clippy warning:
  RUSTFLAGS: -Dwarnings
  # handles issues when running the same appimagetool in parallel:
  NO_CLEANUP: 1
  # handle running the appimage in a docker environment without fuse:
  APPIMAGE_EXTRACT_AND_RUN: 1
  # https://gitlab.com/api/v4/projects/30707566/packages/generic/coolercontrol/branch-or-tag/filename
  # Only correct for refs without a slash (tags, plain branches). Jobs that can run on a
  # grouped branch must pull in .safe_registry_url instead.
  PACKAGE_REGISTRY_URL: '${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/coolercontrol/${CI_COMMIT_REF_NAME}'
  #ARTIFACT_NAME_APPIMAGE: CoolerControl-x86_64.AppImage
  ARTIFACT_NAME_APPIMAGE_DAEMON: CoolerControlD-x86_64.AppImage
  ARTIFACT_NAME_DEB: 'coolercontrol_${CI_COMMIT_TAG}_amd64.deb'
  ARTIFACT_NAME_DEB_D: 'coolercontrold_${CI_COMMIT_TAG}_amd64.deb'
  ARTIFACT_NAME_DEB_BOOKWORM: 'coolercontrol_${CI_COMMIT_TAG}_amd64_bookworm.deb'
  ARTIFACT_NAME_DEB_BOOKWORM_D: 'coolercontrold_${CI_COMMIT_TAG}_amd64_bookworm.deb'
  ARTIFACT_NAME_DEB_BOOKWORM_ARM64: 'coolercontrol_${CI_COMMIT_TAG}_arm64_bookworm.deb'
  ARTIFACT_NAME_DEB_BOOKWORM_D_ARM64: 'coolercontrold_${CI_COMMIT_TAG}_arm64_bookworm.deb'
  ARTIFACT_NAME_UBUNTU: 'coolercontrol_${CI_COMMIT_TAG}_amd64_ubuntu.deb'
  ARTIFACT_NAME_UBUNTU_D: 'coolercontrold_${CI_COMMIT_TAG}_amd64_ubuntu.deb'
  ARTIFACT_NAME_UBUNTU_ARM64: 'coolercontrol_${CI_COMMIT_TAG}_arm64_ubuntu.deb'
  ARTIFACT_NAME_UBUNTU_D_ARM64: 'coolercontrold_${CI_COMMIT_TAG}_arm64_ubuntu.deb'
  CLOUDSMITH_REPOSITORY: coolercontrol/coolercontrol
  DH_URI: docker.io
  DH_REGISTRY_IMAGE: '${DH_URI}/coolercontrol/coolercontrold'
  DH_CLOUD_BUILDER_NAME: "cc-builder-1"
  DH_ORG: "coolercontrol"
  SECRET_DETECTION_ENABLED: 'true'

# The daily schedule runs only the dependency audits, dependabot and the newest-toolchain check.
# Our jobs skip it in their rules; the included security templates are switched off through their
# own variables. A "Release X.Y.Z" commit on the default branch is a release rehearsal.
workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
      variables:
        SAST_DISABLED: 'true'
        SECRET_DETECTION_DISABLED: 'true'
    - if: ($CI_PIPELINE_SOURCE == "push" || $CI_PIPELINE_SOURCE == "web") &&
        $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_COMMIT_TITLE =~ /^Release [0-9]+\.[0-9]+\.[0-9]+$/
      variables:
        RELEASE_REHEARSAL: 'true'
    - when: always

# Release flow and RELEASE_READ_TOKEN: see the `make push-release` step of RELEASING.md.
#
# test:       development checks: lint, the gated suite, MSRV, licensing. Every push and MR.
# prerelease: the shipped source tarballs, tested and packaged the way distros build them.
#             One manual click on prerelease_start in branches and MRs, automatic in a release
#             rehearsal. On a tag, only the check that this commit's rehearsal passed.
# build:      release artifacts and packages. A tag fetches the rehearsal's builds.
# smoke:      install each package and run it once.
# upload:     publish packages: beta builds for branches, releases for tags.
# release:    the GitLab release, or in a rehearsal the check that every job passed.
#
# Job names: <stage>[_beta]_<target>[_<release>][_<arch>], such as upload_beta_debian_old_aarch64.
# Distro targets (debian, ubuntu, fedora) name the release as old (the oldest supported) or
# latest, so moving to a newer release renames nothing. The arch is x86_64 or aarch64, left out
# for jobs that are arch independent or multi-arch.
stages:
  - test
  - prerelease
  - build
  - smoke
  - upload
  - release

image: registry.gitlab.com/coolercontrol/coolercontrol/pipeline:${IMAGE_VERSION}

.cache_template: &cache_template
  cache:
    - &cache_npm
      key:
        files:
          - coolercontrol-ui/package-lock.json
      paths:
        - .npm
      policy: pull-push
    - &cache_cargo_home
      key:
        files:
          - coolercontrold/Cargo.lock
      paths:
        - .cargo
      policy: pull-push
    # This is used for appimage python cache and trunk cache
    - &cache_job
      key: '${CI_JOB_NAME}'
      paths:
        - .pip
        - .cache

# cache_template plus the release build's compiled dependencies. A job merges one or the other:
# merging both keeps only the first one's cache list. Keyed per job, since each builds in its own
# image and jobs running at once would overwrite a shared cache, and not by Cargo.lock, which
# every release and version bump changes: a dependency update rebuilds only what changed. Clear
# the runner caches to drop what has gone stale; a new IMAGE_VERSION starts afresh.
# A rehearsal links this cache into the release, so keep "Use separate caches for protected
# branches" on (Settings > CI/CD > General pipelines): only then can no branch or MR pipeline
# write the cache main reads. A key or policy set in YAML is no guard, as a branch can edit it.
.rust_release_cache: &rust_release_cache
  cache:
    - *cache_npm
    - *cache_cargo_home
    - *cache_job
    - key: rust-release-${CI_JOB_NAME}-${IMAGE_VERSION}
      paths:
        - coolercontrold/target/release/deps
        - coolercontrold/target/release/.fingerprint
        - coolercontrold/target/release/build
      policy: pull-push

# cache_template plus the debug build's compiled dependencies, for test_all. Nothing built from it
# is released.
.rust_debug_cache: &rust_debug_cache
  cache:
    - *cache_npm
    - *cache_cargo_home
    - *cache_job
    - key: rust-debug-${CI_JOB_NAME}-${IMAGE_VERSION}
      paths:
        - coolercontrold/target/debug/deps
        - coolercontrold/target/debug/.fingerprint
        - coolercontrold/target/debug/build
      policy: pull-push

.main_image_template: &main_image_template
  before_script:
    - |
      echo "Job - ${CI_JOB_NAME}"
      echo "Pipeline Source - ${CI_PIPELINE_SOURCE}"
      echo "Commit - ${CI_COMMIT_SHA}"
      echo "Ref - ${CI_COMMIT_REF_NAME}"
      echo "Tag - ${CI_COMMIT_TAG}"

# Grouped branch names (e.g. fix/foo) need the slash replaced before use as a generic package
# version: GitLab reads the first path segment as the version and the rest as a directory in
# the file name. Tags have no slash, so this is a no-op for releases.
.safe_registry_url:
  script:
    - |
      SAFE_REF=$(printf '%s' "${CI_COMMIT_REF_NAME}" | tr '/' '-')
      PACKAGE_REGISTRY_URL="${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/coolercontrol/${SAFE_REF}"

############################################################################################
# development pipeline tests
############################################################################################

include:
- template: Security/SAST.gitlab-ci.yml
- template: Security/Secret-Detection.gitlab-ci.yml
# Pinned exactly: the project is alpha and has broken setups between releases.
- component: $CI_SERVER_FQDN/dependabot-gitlab/dependabot-standalone/template@7.10.0
  inputs:
    gitlab_access_token: $SECURITY_BOT_GITLAB_TOKEN
    github_access_token: $SECURITY_BOT_GITHUB_TOKEN
    # Hours. The default 24 lets a daily run reuse the previous day's advisories and miss new ones.
    advisory_db_cache_ttl: '1'

semgrep-sast:
  variables:
    # The BiDiTrojanSource rule reports the Arabic locale on the strength of its
    # right-to-left script alone, and would report it again for the directional
    # mark that locale needs to set an embedded Latin word off from the text
    # around it. These are translation string tables, not logic, so scanning
    # them buys nothing. `has no bidi formatting characters in locales` in the
    # UI test suite enforces the invariant the rule was reaching for, precisely.
    # The first four entries are the template defaults, repeated because setting
    # this replaces them rather than adding to them.
    SAST_EXCLUDED_PATHS: 'spec, test, tests, tmp, coolercontrol-ui/src/i18n/locales'
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_TAG == null

secret_detection:
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_TAG == null

############################################## Copyright / licensing (REUSE)
# Every file must declare copyright and license. Source files carry SPDX headers;
# everything else is covered by REUSE.toml. Fix a failure with `make copyright-fix`.
test_copyright:
  stage: test
  image: python:3-slim
  tags:
    - saas-linux-small-amd64
  needs: []
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - if: $RELEASE_REHEARSAL == "true"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_TAG == null
  before_script:
    # make: copyright-check runs through it. git: reuse only honours .gitignore
    # when it can find a git executable; without one it ignores nothing and
    # scans the CI caches (.pip, .cargo) and build output as project files.
    - apt-get update && apt-get install -y --no-install-recommends make git
    # The charset-normalizer extra is required: reuse defaults to python-magic,
    # which needs the libmagic C library that the slim image does not ship.
    - pip install --quiet "reuse[charset-normalizer]"
    - reuse --version
    - git --version
  script:
    - make copyright-check

############################################## Tests
# The development gate: lint, the gated suite, UI and Qt tests. A release rehearsal needs it.
test_all:
  stage: test
  tags:
    - saas-linux-xlarge-amd64
  <<: [*rust_debug_cache, *main_image_template]
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - if: $RELEASE_REHEARSAL == "true"
    # This allows us to run a single job for MR branches that are pushed to, and allow these tests
    # to run for external MRs.
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_TAG == null
  needs: []
  variables:
    # this job is the only place a missing liquidctl fails instead of skipping the liqctld tests
    LIQCTLD_TESTS_REQUIRED: '1'
  before_script:
    - python3 --version
    # liqctld's tests call liquidctl's own implementations. Unpinned on purpose: a release that
    # moves what they patch should turn this job red when it lands, not whenever someone gets
    # around to bumping a pin. Full deps, not --no-deps: on Linux liquidctl imports smbus,
    # hidapi and crcmod at module scope, so skipping them breaks `import liquidctl` outright.
    # The image's build-essential and python3-dev are all the smbus sdist needs to build.
    - pip3 install --upgrade liquidctl
    - liquidctl --version
    - cargo --version
    - rustc --version
    - npm --version
    - node --version
    - cmake --version
  script:
    # For Trunk to detect changes, it needs to compare to main and gitlab does a shallow clone by default:
    #- git fetch origin main
    - make ci-check
    - make ci-test -j1
  artifacts:
    when: always
    reports:
      junit: coolercontrold/report.xml
      codequality: coolercontrold/gl-code-quality-report.json
    name: 'CoolerControl_test_binaries_${CI_COMMIT_SHORT_SHA}'
    paths:
      - coolercontrol/build/coolercontrol
      - coolercontrold/target/debug/coolercontrold
    expire_in: 3 days

####################################### MSRV floor
# Every build image ships a newer toolchain than the daemon's declared MSRV, so no other job
# notices when a dependency bump or a stdlib call quietly needs more than we promise. Reads the
# floor out of Cargo.toml so the gate and the manifest cannot drift apart. Merge requests and
# release rehearsals only: an MR catches the change that breaks the floor, and a release cannot
# skip it.
test_msrv:
  stage: test
  <<: [*cache_template]
  rules:
    - if: $RELEASE_REHEARSAL == "true"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  needs: []
  variables:
    # A pure compile check. An older rustc has a different lint set, so the global -Dwarnings
    # would fail this job over warnings the shipped toolchain never emits.
    RUSTFLAGS: ''
  before_script:
    - MSRV=$(sed -n 's/^rust-version = "\(.*\)"$/\1/p' coolercontrold/daemon/Cargo.toml)
    - echo "MSRV declared in daemon/Cargo.toml - ${MSRV}"
    - rustup toolchain install "$MSRV" --profile minimal
    - rustup run "$MSRV" rustc --version
  script:
    # No UI build is needed: resources/app ships a tracked .gitignore, so include_dir! still
    # resolves the directory. Every target: distros also compile the tests, for %check and
    # dh_auto_test.
    - rustup run "$MSRV" cargo check --locked --manifest-path coolercontrold/Cargo.toml --workspace
      --all-targets

####################################### Newest Rust toolchain
# Arch and AUR users build with the newest stable Rust as soon as it ships, so its new warnings
# reach them first. Daily, so a Rust release shows up within a day; the latest prerelease jobs
# run the same check, so a release rehearsal fails on it too.
test_rust_latest:
  stage: test
  image: rust:latest
  <<: [*cache_template]
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
  needs: []
  before_script:
    - apt-get update
    - DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends libdrm-dev pkg-config
    - rustc --version
  script:
    - cargo check --locked --all-targets --manifest-path coolercontrold/Cargo.toml
    - cargo check --locked --all-targets --manifest-path coolercontrold/Cargo.toml --features gated-tests

####################################### Dependency audit
# Daily schedule only, so a contributor's MR never has to fix unrelated crates. RustSec
# findings fail the job and open a lockfile-only fix MR, since dependabot's GitHub advisory
# source can lag RustSec by weeks.
test_cargo_audit:
  stage: test
  needs: []
  cache:
    - key:
        files:
          - coolercontrold/Cargo.lock
      paths:
        - .cargo
      policy: pull
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
  script:
    - .gitlab/scripts/cargo-audit.sh

# Daily schedule only, like test_cargo_audit. OSV findings, dev dependencies included, fail the job.
# Fix MRs come from dependabot.
test_npm_audit:
  stage: test
  image:
    name: ghcr.io/google/osv-scanner:v2.6.0
    entrypoint: ['']
  needs: []
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
  script:
    - /osv-scanner scan source --config coolercontrol-ui/osv-scanner.toml
      --lockfile coolercontrol-ui/package-lock.json

# dependabot-gitlab's npm job (config in .gitlab/dependabot.yml). The component gates it on a
# PACKAGE_MANAGER_SET schedule variable; replacing its rules lets the one daily schedule run it.
# Allowed to fail: an advisory with no fixed release fails the run, and nothing in dependabot.yml
# can skip it. test_npm_audit is the gate, with its expiring ignores in osv-scanner.toml.
npm:
  variables:
    DIRECTORY: /coolercontrol-ui
  allow_failure: true
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"

############################################################################################
# prerelease: the shipped sources, tested and packaged the way distros build them
############################################################################################

####################################### source tarball
prerelease_source:
  stage: prerelease
  # no caching here due to vendoring and for a clean solid build
  <<: [*main_image_template]
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    # A tag uploads its source only once its rehearsal is verified.
    - if: $CI_COMMIT_TAG
      needs:
        - prerelease_verify
    - if: $CI_PIPELINE_SOURCE
  needs: []
  before_script:
    - cargo --version
    - rustc --version
    - npm --version
    - node --version
  script:
    # On fork merge requests the source branch lives in the contributor's project, not in
    # CI_PROJECT_URL, so clone the MR source project/branch when those vars are set. A release
    # must ship its own commit; merged results pipelines test a merge commit instead.
    - |
      if [ "${RELEASE_REHEARSAL:-}" = true ] || [ -n "${CI_COMMIT_TAG:-}" ]; then
        export EXPECTED_SHA="${CI_COMMIT_SHA}"
      fi
      SOURCE_URL="${CI_MERGE_REQUEST_SOURCE_PROJECT_URL:-$CI_PROJECT_URL}"
      SOURCE_REF="${CI_MERGE_REQUEST_SOURCE_BRANCH_NAME:-$CI_COMMIT_REF_NAME}"
      packaging/release-source.sh "$SOURCE_URL" "$SOURCE_REF"
    - make vendor
    # SAFE_REF is also used for the tarball filenames:
    - !reference [.safe_registry_url, script]
    - |
      cp coolercontrold-vendor.tar.gz "coolercontrold-vendor-${SAFE_REF}.tar.gz"
      curl --header "JOB-TOKEN: ${CI_JOB_TOKEN}" --upload-file "coolercontrol-${SAFE_REF}.tar.gz" "${PACKAGE_REGISTRY_URL}/coolercontrol-${SAFE_REF}.tar.gz"
      curl --header "JOB-TOKEN: ${CI_JOB_TOKEN}" --upload-file coolercontrold-vendor.tar.gz "${PACKAGE_REGISTRY_URL}/coolercontrold-vendor.tar.gz"
      curl --header "JOB-TOKEN: ${CI_JOB_TOKEN}" --upload-file "coolercontrold-vendor-${SAFE_REF}.tar.gz" "${PACKAGE_REGISTRY_URL}/coolercontrold-vendor-${SAFE_REF}.tar.gz"
  artifacts:
    name: 'coolercontrol-${CI_COMMIT_REF_SLUG} Source'
    paths:
      - coolercontrol-*.tar.gz
      - coolercontrold-vendor.tar.gz
      - coolercontrold-vendor-*.tar.gz
    expire_in: 14 days

# Branch and MR pipelines add the prerelease jobs behind one manual click on prerelease_start,
# skipping the duplicate branch pipeline of an open MR. A manual run only checks: it builds,
# stages and publishes nothing. A release rehearsal runs them automatically. Tags skip them: the
# rehearsal already ran them on the same commit, which prerelease_verify checks.
.prerelease_rules_common:
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule" || $CI_COMMIT_TAG
      when: never
    - if: $RELEASE_REHEARSAL == "true"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never

.prerelease_rules:
  rules:
    - !reference [.prerelease_rules_common, rules]
    - if: $CI_PIPELINE_SOURCE

prerelease_start:
  stage: prerelease
  image: alpine:3
  tags:
    - saas-linux-small-amd64
  needs: []
  rules:
    - !reference [.prerelease_rules_common, rules]
    - if: $CI_PIPELINE_SOURCE
      when: manual
      allow_failure: true
  script:
    - echo "Starting the prerelease jobs."

# The first job of a tag pipeline: nothing is built or published unless the release rehearsal of
# this exact commit passed in a pipeline of the default branch.
prerelease_verify:
  stage: prerelease
  image: python:3-slim
  tags:
    - saas-linux-small-amd64
  needs: []
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - if: $CI_COMMIT_TAG
  script:
    - python3 .gitlab/scripts/release_rehearsal.py verify
  artifacts:
    reports:
      dotenv: rehearsal.env

####################################### Test suite on old and new distros
# The source tarball and vendored crates, built offline in release mode: the default suite as
# distros run it, then the gated tests. The oldest supported userland (the jammy image the release
# packages are built in, with its pinned Rust) and the newest (ubuntu:rolling with the newest
# stable Rust, as Arch and the AUR build), on native x86_64 and aarch64. The newest also fails on
# any compiler warning, which its users would see.
.prerelease_test:
  extends: .prerelease_rules
  stage: prerelease
  needs:
    - prerelease_start
    - prerelease_source
  timeout: 1h
  script:
    - !reference [.safe_registry_url, script]
    - .gitlab/scripts/prerelease-test.sh "coolercontrol-${SAFE_REF}.tar.gz" coolercontrold-vendor.tar.gz

prerelease_ubuntu_old_x86_64:
  extends: .prerelease_test
  image: registry.gitlab.com/coolercontrol/coolercontrol/ubuntu:${IMAGE_VERSION}
  tags:
    - saas-linux-xlarge-amd64

prerelease_ubuntu_latest_x86_64:
  extends: .prerelease_test
  image: ubuntu:rolling
  tags:
    - saas-linux-xlarge-amd64
  variables:
    RUST_VERSION: stable
    PRERELEASE_DENY_WARNINGS: '1'

prerelease_ubuntu_old_aarch64:
  extends: .prerelease_test
  image: registry.gitlab.com/coolercontrol/coolercontrol/ubuntu:${IMAGE_VERSION}
  tags:
    - saas-linux-large-arm64

# glibc 2.43 made THP heaps the aarch64 malloc default, which broke a test only on OBS.
prerelease_ubuntu_latest_aarch64:
  extends: .prerelease_test
  image: ubuntu:rolling
  tags:
    - saas-linux-large-arm64
  variables:
    RUST_VERSION: stable
    PRERELEASE_DENY_WARNINGS: '1'

####################################### Fedora RPM specs
# Both specs built in mock from the source tarballs, offline in a fresh chroot as Copr builds
# them, so %check runs the default suite under Fedora's Rust. Branches and MRs build the rc1 specs
# against their own ref; a release rehearsal builds the release specs of its version. mock needs
# the privileged job container that the docker:dind jobs rely on too.
.prerelease_rpm:
  extends: .prerelease_rules
  stage: prerelease
  image: fedora:latest
  needs:
    - prerelease_start
    - prerelease_source
  timeout: 2h
  script:
    - |
      if [ "${RELEASE_REHEARSAL:-}" = true ]; then
        export PRERELEASE_VERSION="${CI_COMMIT_TITLE#Release }"
      fi
    - export PRERELEASE_RESULT_DIR="${CI_PROJECT_DIR}/rpm-results"
    - .gitlab/scripts/prerelease-rpm.sh "${CI_PROJECT_DIR}" "${CI_COMMIT_REF_NAME}"
  artifacts:
    when: always
    name: 'CoolerControl_rpm_${CI_JOB_NAME}_${CI_COMMIT_SHORT_SHA}'
    paths:
      - rpm-results/
    expire_in: 5 days

prerelease_fedora_latest_x86_64:
  extends: .prerelease_rpm
  tags:
    - saas-linux-xlarge-amd64

prerelease_fedora_latest_aarch64:
  extends: .prerelease_rpm
  tags:
    - saas-linux-large-arm64

############################################################################################
# compile all release artifacts
# A tag's package builds run on_success, not always: a tag builds nothing the gate in
# build_start has not passed.
############################################################################################

# manual and automatic trigger for all artifacts & packages. Every build hangs off this job. A
# release rehearsal builds everything, in parallel with its checks. A tag builds nothing until
# prerelease_verify has found this commit's passed rehearsal, and then fetches its builds.
build_start:
  stage: build
  <<: [*main_image_template]
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - if: $CI_COMMIT_TAG
      needs:
        - prerelease_verify
    - if: $RELEASE_REHEARSAL == "true"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: on_success
    - when: manual
      allow_failure: true
  needs: []
  script:
    #- make ci-check
    - echo "All release compilation jobs triggered."

# A tag pipeline fetches the artifacts of the same job in its commit's rehearsal instead of
# building again, so it publishes the very files the rehearsal tested, at the same paths. Every
# fetch uses the one rehearsal prerelease_verify checked (REHEARSAL_PIPELINE_ID), so these jobs
# need it.
.release_artifacts:
  fetch:
    - |
      if [ -n "${CI_COMMIT_TAG:-}" ]; then
        python3 .gitlab/scripts/release_rehearsal.py fetch "${CI_JOB_NAME}"
        exit 0
      fi

####################################### AppImages (Ubuntu 22.04)
build_appimage_x86_64:
  image: registry.gitlab.com/coolercontrol/coolercontrol/appimage:${IMAGE_VERSION}
  <<: [*rust_release_cache, *main_image_template]
  stage: build
  tags:
    - saas-linux-xlarge-amd64
  needs:
    - build_start
    - job: prerelease_verify
      optional: true
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - if: $CI_PIPELINE_SOURCE
  before_script:
    - cat $GPG_KEY | gpg --batch --import
    # makes it non-interactive
    - echo $GPG_PHRASE | gpg --batch --always-trust --yes --passphrase-fd 0 --pinentry-mode=loopback -s $(mktemp)
    - python3 --version
    - cargo --version
    - rustc --version
    - npm --version
    - node --version
    - cmake --version
  script:
    - !reference [.release_artifacts, fetch]
    - make build-appimages -j1
    - make appimages -j2
    - make assets
  artifacts:
    name: 'CoolerControl_x86_64_AppImages_${CI_COMMIT_SHORT_SHA}'
    paths:
      - CoolerControlD-x86_64.AppImage
      - assets-built/coolercontrold
      - assets-built/coolercontrol
