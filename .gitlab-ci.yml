smoke_appimage_x86_64:
  stage: smoke
  image: ubuntu:jammy
  dependencies:
    - build_appimage_x86_64
  needs:
    - build_appimage_x86_64
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - if: $CI_PIPELINE_SOURCE
  script:
    - ls -lah ./
    - chmod +x CoolerControlD-x86_64.AppImage
    - ./CoolerControlD-x86_64.AppImage --version
    #- ./CoolerControl-x86_64.AppImage --version

smoke_binary_aarch64:
  stage: smoke
  image: ubuntu:jammy
  tags:
    - saas-linux-small-arm64
  dependencies:
    - build_binary_aarch64
  needs:
    - build_binary_aarch64
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
