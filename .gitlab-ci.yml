############################################################################################
# Create Release
############################################################################################
####################################### apt.coolercontrol.org (Cloudflare R2)
# Two jobs rather than one because the bookworm and jammy builds share deb file names and would
# collide in a single workspace. They also target different trees. The publish lock in
# apt-repo-publish serializes them, so running them in parallel is safe.
upload_package_r2_debian:
  stage: upload_packages
  image: registry.gitlab.com/coolercontrol/coolercontrol/apt-publish:${IMAGE_VERSION}
  variables:
    # setup.sh and the keys belong to this project, so publish them from the tagged commit
    # rather than from whatever copies the image happens to carry. Only this job and its ubuntu
    # twin pass --refresh-root; the sibling package repositories publish packages only.
    APT_REPO_SHARE: $CI_PROJECT_DIR/packaging/apt-repo
  dependencies:
    - build_deb_bookworm_amd64
    - build_deb_bookworm_arm64
  needs:
    - build_deb_bookworm_amd64
    - test_deb_bookworm_amd64
    - build_deb_bookworm_arm64
    - test_deb_bookworm_arm64
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - if: $CI_COMMIT_TAG
  script:
    - ls -lah ./*.deb
    - apt-repo-publish --repo debian --refresh-root ./*.deb

upload_package_r2_ubuntu:
  stage: upload_packages
  image: registry.gitlab.com/coolercontrol/coolercontrol/apt-publish:${IMAGE_VERSION}
  variables:
    APT_REPO_SHARE: $CI_PROJECT_DIR/packaging/apt-repo
  dependencies:
    - build_ubuntu
    - build_ubuntu_arm64
  needs:
    - build_ubuntu
    - test_ubuntu_22.04
    - test_ubuntu_latest
    - build_ubuntu_arm64
    - test_ubuntu_arm64
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - if: $CI_COMMIT_TAG
  script:
    - ls -lah ./*.deb
    - apt-repo-publish --repo ubuntu --refresh-root ./*.deb

create_release:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  needs:
    - upload_package_appimage
    - upload_artifacts_arm64
    - upload_package_deb_bookworm_amd64
    - upload_package_deb_bookworm_arm64
    - upload_package_ubuntu
    - upload_package_ubuntu_arm64
    # A release that is missing from apt.coolercontrol.org would strand transitioned users, so
    # the release waits on both trees having been published.
    - upload_package_r2_debian
    - upload_package_r2_ubuntu
    - push_dh-debian
    #- push_dh-debian_amd64
    #- push_dh-debian_arm64
    - push_dh-alpine
    #- push_dh-alpine_amd64
    #- push_dh-alpine_arm64
    - build_source_assets
  before_script:
    - echo 'Starting release job'
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - if: $CI_COMMIT_TAG
  script:
    - echo "running release job for v${CI_COMMIT_TAG:?}"
    # The repo holds the feature presentations. When this tag has one, link it at the top of the
    # release, pinned to the tag. Release descriptions do not resolve repo-relative links.
    - |
      NOTES=".gitlab/release-notes/${CI_COMMIT_TAG:?}.md"
      if [ -f "${NOTES}" ]; then
        printf '[Feature Presentation](%s/-/blob/%s/%s)\n\n## Full Changelog\n\n' \
          "${CI_PROJECT_URL:?}" "${CI_COMMIT_TAG:?}" "${NOTES}" > ./description.txt
      else
        : > ./description.txt
      fi
    - awk -v ver="${CI_COMMIT_TAG:?}" '/^#+ \[/ { if (p) { exit }; if ($2 == "["ver"]") { p=1; next} } p && NF' ./CHANGELOG.md >> ./description.txt
  release:
    name: 'CoolerControl v${CI_COMMIT_TAG}'
    description: ./description.txt
    tag_name: $CI_COMMIT_TAG
    ref: $CI_COMMIT_TAG
    milestones:
      - $CI_COMMIT_TAG
    assets:
      links:
        # Debian Packages:
        - name: Debian Bookworm - Daemon x86_64 
          filepath: '/packages/${ARTIFACT_NAME_DEB_BOOKWORM_D}'
          url: '${PACKAGE_REGISTRY_URL}/${ARTIFACT_NAME_DEB_BOOKWORM_D}'
          link_type: package
        - name: Debian Bookworm - UI x86_64
          filepath: '/packages/${ARTIFACT_NAME_DEB_BOOKWORM}'
          url: '${PACKAGE_REGISTRY_URL}/${ARTIFACT_NAME_DEB_BOOKWORM}'
          link_type: package
        - name: Debian Bookworm - Daemon aarch64
          filepath: '/packages/${ARTIFACT_NAME_DEB_BOOKWORM_D_ARM64}'
          url: '${PACKAGE_REGISTRY_URL}/${ARTIFACT_NAME_DEB_BOOKWORM_D_ARM64}'
          link_type: package
        - name: Debian Bookworm - UI aarch64
          filepath: '/packages/${ARTIFACT_NAME_DEB_BOOKWORM_ARM64}'
          url: '${PACKAGE_REGISTRY_URL}/${ARTIFACT_NAME_DEB_BOOKWORM_ARM64}'
          link_type: package
        - name: Ubuntu 22.04+ - Daemon
          filepath: '/packages/${ARTIFACT_NAME_UBUNTU_D}'
          url: '${PACKAGE_REGISTRY_URL}/${ARTIFACT_NAME_UBUNTU_D}'
          link_type: package
        - name: Ubuntu 22.04+ - UI
          filepath: '/packages/${ARTIFACT_NAME_UBUNTU}'
          url: '${PACKAGE_REGISTRY_URL}/${ARTIFACT_NAME_UBUNTU}'
          link_type: package
        - name: Ubuntu 22.04+ - Daemon aarch64
          filepath: '/packages/${ARTIFACT_NAME_UBUNTU_D_ARM64}'
          url: '${PACKAGE_REGISTRY_URL}/${ARTIFACT_NAME_UBUNTU_D_ARM64}'
          link_type: package
        - name: Ubuntu 22.04+ - UI aarch64
          filepath: '/packages/${ARTIFACT_NAME_UBUNTU_ARM64}'
          url: '${PACKAGE_REGISTRY_URL}/${ARTIFACT_NAME_UBUNTU_ARM64}'
          link_type: package
        # AppImages:
        - name: AppImage Daemon
          filepath: '/packages/${ARTIFACT_NAME_APPIMAGE_DAEMON}'
          url: '${PACKAGE_REGISTRY_URL}/${ARTIFACT_NAME_APPIMAGE_DAEMON}'
          link_type: other
        # Assets:
        - name: Official Source Tarball
          filepath: '/packages/coolercontrol-${CI_COMMIT_TAG}.tar.gz'
          url: '${PACKAGE_REGISTRY_URL}/coolercontrol-${CI_COMMIT_TAG}.tar.gz'
          link_type: other
        - name: Daemon Binary x86_64
          filepath: '/packages/coolercontrold_${CI_COMMIT_TAG}'
          url: '${PACKAGE_REGISTRY_URL}/coolercontrold_${CI_COMMIT_TAG}'
          link_type: other
        - name: Desktop Application Binary x86_64
          filepath: '/packages/coolercontrol_${CI_COMMIT_TAG}'
          url: '${PACKAGE_REGISTRY_URL}/coolercontrol_${CI_COMMIT_TAG}'
          link_type: other
        - name: Daemon Vendored Cargo Dependencies
          filepath: '/packages/coolercontrold-vendor.tar.gz'
          url: '${PACKAGE_REGISTRY_URL}/coolercontrold-vendor.tar.gz'
          link_type: other
        - name: Daemon Vendored Cargo Dependencies (versioned)
          filepath: '/packages/coolercontrold-vendor-${CI_COMMIT_TAG}.tar.gz'
          url: '${PACKAGE_REGISTRY_URL}/coolercontrold-vendor-${CI_COMMIT_TAG}.tar.gz'
          link_type: other
        - name: UI Build Assets x86_64
          filepath: '/packages/coolercontrol-ui-vendor.tar.gz'
          url: '${PACKAGE_REGISTRY_URL}/coolercontrol-ui-vendor.tar.gz'
          link_type: other
        - name: Daemon Binary aarch64
