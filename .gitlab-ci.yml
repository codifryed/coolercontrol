############################################################################################
# Docker
# build_docker_debian and build_docker_alpine use the Docker Hub cloud builder (limited build
# minutes), whose two builds fail when they run at the same time, hence the shared
# resource_group. A release rehearsal skips the build_beta_docker jobs: it publishes nothing.
############################################################################################

####################################### debian Docker Images

build_docker_debian:
  image: docker:dind
  <<: [*main_image_template]
  stage: build
  services:
    - docker:dind
  resource_group: dockerhub
  needs:
    - build_start
    - job: prerelease_verify
      optional: true
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - if: $CI_COMMIT_TAG
    - if: $RELEASE_REHEARSAL == "true"
  script:
    - .gitlab/scripts/dockerhub-release.sh debian
  artifacts:
    paths:
      - dockerhub-debian.digest
    expire_in: 5 days

build_beta_docker_debian_x86_64:
  image: docker:dind
  <<: [*main_image_template]
  stage: build
  tags:
    - saas-linux-xlarge-amd64
  services:
    - docker:dind
  variables:
    DOCKER_DRIVER: overlay2
  needs:
    - build_start
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - if: $RELEASE_REHEARSAL == "true"
      when: never
    - if: $CI_PIPELINE_SOURCE && $CI_COMMIT_TAG == null
      when: manual
      allow_failure: true
  script:
    - |
      if [ "$CI_COMMIT_TAG" ]; then 
        IMAGE_TAG=$CI_COMMIT_TAG
      else 
        IMAGE_TAG="beta-$CI_MERGE_REQUEST_IID"
      fi
      export IMAGE_TAG
    - echo "$DH_REGISTRY_PASSWORD" | docker login -u "$DH_REGISTRY_USER" --password-stdin "$DH_URI"
    - |
      if [ "$CI_COMMIT_TAG" ]; then
        TAG_LINE="--tag $DH_REGISTRY_IMAGE:$IMAGE_TAG --tag $DH_REGISTRY_IMAGE:latest"
      else 
        TAG_LINE="--tag $DH_REGISTRY_IMAGE:$IMAGE_TAG"
      fi
      export TAG_LINE
    - |
      apk add curl jq
      ARCH=${CI_RUNNER_EXECUTABLE_ARCH#*/}
      BUILDX_URL=$(curl -s https://raw.githubusercontent.com/docker/actions-toolkit/main/.github/buildx-lab-releases.json | jq -r ".latest.assets[] | select(endswith(\"linux-$ARCH\"))")
      mkdir -vp ~/.docker/cli-plugins/
      curl --silent -L --output ~/.docker/cli-plugins/docker-buildx $BUILDX_URL
      chmod a+x ~/.docker/cli-plugins/docker-buildx
    - |
      docker buildx build \
        --platform linux/amd64 \
        $TAG_LINE \
        -f .gitlab/images/dockerhub/debian/Dockerfile \
        --push \
        .
    #- docker build $TAG_LINE -f .gitlab/images/dockerhub/debian/Dockerfile ./
    #- docker run --name cc-dh-debian-amd64-test --rm -i $DH_REGISTRY_IMAGE:$IMAGE_TAG --version
    #- docker push $DH_REGISTRY_IMAGE:$IMAGE_TAG
    #- if [ "$CI_COMMIT_TAG" ]; then docker push $DH_REGISTRY_IMAGE:latest; fi;
    - echo "Successful. amd64 Image pushed as $DH_REGISTRY_IMAGE:$IMAGE_TAG"

