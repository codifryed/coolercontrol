####################################### Ubuntu aarch64 packages
# These used to be built by hand and uploaded to Cloudsmith after the fact (RELEASING.md). Both
# package trees serve amd64 and arm64, so they are built here instead.
#
# Same multi-arch image as build_ubuntu, so both architectures of a release are built with the
# same toolchain.
build_ubuntu_arm64:
  image: registry.gitlab.com/coolercontrol/coolercontrol/ubuntu:${IMAGE_VERSION}
  <<: [*cache_template, *rust_release_cache_arm64, *main_image_template]
  stage: build
  tags:
    - saas-linux-large-arm64
  needs:
    - compile_artifacts
    # Same reason as build_deb_bookworm_arm64: running both architectures at once causes trouble.
    - build_ubuntu
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - if: $CI_PIPELINE_SOURCE && $CI_COMMIT_TAG == null
      when: manual
      allow_failure: true
    - if: $CI_COMMIT_TAG
      when: always
  script:
    # cleanup old build files (somehow stays between runs)
    - rm -f ../coolercontrol*.deb
    - apt-get update
    - |
      python3 --version
      cargo --version
      rustc --version
      npm --version
      node --version
      cmake --version
    - dpkg-architecture -l
    # -d skips dpkg-checkbuilddeps: this image's cargo comes from rustup, not a deb package
    - dpkg-buildpackage -d -us -B
    - ls -lah ../
    - cp ../coolercontrol*_arm64.* ./
    - rm -f coolercontrol*-dbgsym*.*deb
  artifacts:
    name: 'CoolerControl_aarch64_ubuntu_${CI_COMMIT_SHORT_SHA}'
    paths:
      - coolercontrol*.deb
    expire_in: 5 days

