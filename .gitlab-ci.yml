      when: never
    - if: $CI_PIPELINE_SOURCE && $CI_COMMIT_TAG == null
      when: manual
      allow_failure: true
    - if: $CI_COMMIT_TAG
      when: always
  script:
    # cleanup old build files (somehow stays between runs)
    - rm -f ../coolercontrol*.deb
    # build dependencies:
    #- >
      #apt-get -y install liquidctl
      #dh-python
      #pybuild-plugin-pyproject
      #python3-all
      #python3-setuptools
      #python3-build
      #python3-setproctitle
      #python3-fastapi
      #python3-uvicorn
      #nodejs
      #npm
      #build-essential
      #cmake
      #qt6-base-dev
      #qt6-webengine-dev
      #qt6-webengine-dev-tools
      #libdrm-dev
      #cargo-web
    - |
      python3 --version
      cargo --version
      rustc --version
      npm --version
      node --version
      cmake --version
    - dpkg-architecture -l
    # -d skips dpkg-checkbuilddeps: this image's cargo comes from rustup, not a deb package
    - dpkg-buildpackage -d -us -B
    - ls -lah ../
    - cp ../coolercontrol*_arm64.* ./
    - rm -f coolercontrol*-dbgsym*.*deb
  artifacts:
    name: 'CoolerControl_aarch64_deb_${CI_COMMIT_SHORT_SHA}'
    paths:
      - coolercontrol*.deb
    expire_in: 5 days

