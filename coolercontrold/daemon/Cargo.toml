[package]
name = "coolercontrold"
version = "5.0.0"
authors = ["Guy Boldon <gb@guyboldon.com>"]
edition = "2024"
# MSRV. Set by `compio-rt` (the default feature), which needs 1.95.
rust-version = "1.95"
description = "Monitor and control your cooling and other devices"
documentation = "https://coolercontrol.org"
readme = "README.md"
categories = ["hardware-support"]
keywords = ["temperature", "hardware", "cooling", "fan", "monitor"]
homepage = "https://coolercontrol.org"
repository = "https://gitlab.com/coolercontrol/coolercontrol"
license = "GPL-3.0-or-later"

[features]
default = ["compio-rt"]
# compio main runtime (default). When off (`--no-default-features`), the tokio runtime is used.
compio-rt = ["dep:compio", "dep:cyper-core", "dep:compio-buf"]
# Gates tests excluded from the normal suite: ones unreliable outside a controlled environment
# (wall-clock latency assertions, performance-sensitive, real hardware). Off by default; CI enables
# them with `--features gated-tests`. See RUST_STYLE.md "Gated Tests".
gated-tests = []

[dependencies]
cc-detect = { path = "../cc-detect" }
cc-image = { path = "../cc-image" }
cc-stress = { path = "../cc-stress" }
# compio (opt-in `compio-rt` feature). 0.19 needs Rust 1.95 (`cfg_select`), which sets our MSRV.
# Taken for `IORING_ENTER_NO_IOWAIT` (compio-driver 0.12.5): without it the idle
# `io_uring_enter(GETEVENTS)` wait is accounted as iowait on kernel 6.5+, pinning a core at 100%
# on per-core monitors (issue 606). The flag needs kernel 6.15+, so `CC_RUNTIME_DRIVER=poll`
# remains the escape hatch for 6.5 through 6.14.
# Fusion driver = io-uring + polling: auto-falls-back to polling when io_uring is unavailable
# (e.g. kernel.io_uring_disabled=2).
compio = { version = "=0.19.2", default-features = false, features = [
  "runtime",
  "time",
  "signal",
  "fs",
  "net",
  "process",
  "io-uring",
  "polling",
], optional = true }
# cyper-core bridges a compio stream (our UDS to liqctld) into hyper's IO traits via `HyperStream`.
# Pinned to 0.9: it must resolve to the same compio 0.19 as above, or the stream types will not match.
cyper-core = { version = "=0.9.0", default-features = false, optional = true }
# Must resolve to the same compio-buf as compio 0.19 above, or the buffer traits will not match.
compio-buf = { version = "=0.8.3", default-features = false, optional = true }
log = "0.4"
env_logger = "0.11"
systemd-journal-logger = "2.2"
clap = { version = "4.6", features = [
  "derive",
] } # Command line argument parser - pkg
anyhow = "1.0"
thiserror = "2.0"
tokio = { version = "1.53", default-features = false, features = [
  "rt",
  "fs",
  "macros",
  "parking_lot",
  "time",
  "sync",
  "signal",
  "net",
  "io-std",
  "io-util",
  "process",
] }
tokio-util = "0.7.19"
tokio-stream = { version = "0.1.18", default-features = false, features = [
  "sync",
  "io-util",
] }
moro-local = "0.4.0"
async-trait = "0.1"
bitflags = { version = "2.13", features = ["serde"] }
axum = { version = "0.8.9", features = ["multipart", "macros", "query"] }
# This should follow the dependencies of axum version as well
tower = { version = "0.5.3" }
tower-http = { version = "0.7.0", features = [
  "timeout",
  "trace",
  "limit",
  "cors",
  "normalize-path",
  # br + gzip + deflate, deliberately not the `-full` sets: those add zstd, whose
  # zstd-sys builds bundled C source. Clients that offer zstd negotiate down to br.
  "compression-br",
  "compression-gzip",
  "compression-deflate",
  "decompression-br",
  "decompression-gzip",
  "decompression-deflate",
  "fs",
] }
tower-sessions = { version = "0.15.0", features = ["private"] }
tower-sessions-core = { version = "0.15.0", features = ["deletion-task"] }
# Held at 0.22 to share one base64 with cookie, pem/rcgen and tonic.
base64 = "=0.22"
time = "0.3"
# The `metadata` feature bakes each embedded file's mtime in at compile time and
# answers If-Modified-Since with a 304, so unhashed assets can revalidate cheaply
# instead of being pinned for a year with no way to ever update.
tower-serve-static = { version = "0.1.2", features = ["metadata"] }
include_dir = "0.7.4"
aide = { version = "0.15.1", features = [
  "axum",
  "axum-json",
  "axum-query",
  "axum-multipart",
] }
# this needs to follow the aide version above (currently 0.9.0)
schemars = { version = "=0.9.0", features = ["chrono04"] }
mime = "0.3"
# TLS support: use ring as the rustls crypto provider (already pulled in by rcgen)
# to avoid the aws-lc-rs/aws-lc-sys C dependency tree.
axum-server = { version = "0.8.0", default-features = false, features = [
  "tls-rustls-no-provider",
] }
rustls = { version = "0.23", default-features = false, features = [
  "ring",
  "logging",
  "std",
  "tls12",
] }
rcgen = "0.14"
pin-project-lite = "0.2"
tokio-rustls = { version = "0.26", default-features = false, features = [
  "ring",
  "logging",
  "tls12",
] }
tempfile = "3.27"
# Backup archives: tar + gzip. flate2 is already compiled in the tree (tower-http
# compression); declaring it directly lets the backup module reuse it with no new
# codegen. tar is pure Rust with no C dependency; xattrs are unused for config backups.
flate2 = "1.1"
tar = { version = "0.4", default-features = false }
hyper = { version = "1.11", default-features = false, features = [
  "http1",
  "client",
] }
hyper-util = { version = "0.1", default-features = false, features = [
  "client",
  "http1",
  "tokio",
] }
http-body-util = "0.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
zbus = { version = "5.18", default-features = false, features = [
  "tokio",
] } # our preferred DBus lib
futures-util = { version = "0.3", default-features = false, features = [
  "std",
] } # future utilities we use like join3
# sysinfo > 0.38 requires Rust >= 1.95
sysinfo = { version = "=0.38", default-features = false, features = [
  "system",
] } # gets detailed system info
chrono = { version = "0.4.45", features = [
  "serde",
] } # We use timestamps in our status history
strum = { version = "0.28.0", features = ["derive"] } # Enum -> String
regex = "1.13"
heck = "0.5.0" # hanldes case conversion like CamelCase and Title Case.
# nu-glob > 0.111 requires Rust >=1.92
nu-glob = "=0.111"
nvml-wrapper = "0.12.1"
# Held at 0.8 to share one libloading with ash, khronos-egl, libdrm_amdgpu_sys,
# nvml-wrapper and wgpu-hal. 0.9 buys us nothing and would duplicate the stack.
libloading = "0.8"
# Held at 0.10 to share one digest stack with the sha2 that cookie/tower-sessions pulls.
sha2 = "=0.10"
argon2 = "0.5"
subtle = "2.6"
toml_edit = { version = "0.23.9", features = ["serde"] }
nix = { version = "0.31.3", default-features = false, features = [
  "user",
  "signal",
  "process",
  "sched",
  "net",
] }
libdrm_amdgpu_sys = { version = "0.8.16", default-features = false, features = [
  "dynamic_loading",
] }
indexmap = "2.14"
uuid = { version = "1.24", features = ["v4"] }
# service plugin dependencies
tonic = { version = "0.14.6", default-features = false, features = [
  "channel",
  "codegen",
  "server",
  "transport",
  "router",
] }
prost = "0.14.4"
tonic-prost = "0.14.6"
tonic-health = "0.14.6"
# Pure Rust (libc only, no libsystemd C dependency). 0.5 for
# `watchdog_enabled() -> Option<Duration>`; 0.4 used an out-parameter.
sd-notify = "0.5.0"

[dev-dependencies]
# serial_test 4.0 requires Rust >=1.93.1
serial_test = "=3.5"
tokio = { version = "1.53", default-features = false, features = ["test-util"] }

[build-dependencies]
tonic-prost-build = "0.14.6"
tonic-build = "0.14.6"
# Pure-Rust protobuf compiler: drops the protoc binary as a system build dependency. Pinned to 0.9.1
# to match prost 0.14 (tonic-prost-build).
# build.rs persists its descriptor set (via the re-exported protox::prost) for the gRPC reflection service.
protox = "=0.9.1"

[lints.clippy]
upper_case_acronyms = "allow"
type_complexity = "allow"
too_many_arguments = "allow"
doc_lazy_continuation = "allow"
collapsible_if = "allow"
